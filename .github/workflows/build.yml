name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

jobs:
  build_number:
    runs-on: github-ubuntu-latest-s
    name: Get build number
    outputs:
      BUILD_NUMBER: ${{ steps.build-number.outputs.BUILD_NUMBER }}
    permissions:
      id-token: write
    steps:
      - uses: SonarSource/ci-github-actions/get-build-number@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
        id: build-number

  build_maven_parent:
    needs: build_number
    runs-on: github-ubuntu-latest-m
    name: Build Maven Parent
    permissions:
      id-token: write
      contents: write
    env:
      BUILD_NUMBER: ${{ needs.build_number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          install_args: --jobs 1

      - name: Install dependencies
        run: |
          bash .github/scripts/install_dependencies.sh

      - name: Get Repox Credentials from Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@c154b4a417b51cb98dd71137f49bf20e77c56820 # 3.4.0
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - name: Populate Maven settings
        run: |
          mkdir ~/.m2 && cp .github/workflows/resources/settings.xml ~/.m2/settings.xml

      - name: Build dotnet project
        env:
          # for nuget
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          # for Maven
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          # Restore the .NET project using Repox as source feed
          dotnet restore omnisharp-dotnet/SonarLint.OmniSharp.DotNet.Services.sln \
            --locked-mode \
            --configfile omnisharp-dotnet/nuget.config

          # Get OmniSharp fork from Binaries
          mvn generate-resources -B -DskipIts -Pdownload-omnisharp-for-building

          # Build and run .NET unit tests
          dotnet test omnisharp-dotnet/SonarLint.OmniSharp.DotNet.Services.sln \
            -c Release \
            -p:CollectCoverage=true -p:CoverletOutput=TestResults/ -p:CoverletOutputFormat=opencover \
            --no-restore

      - uses: SonarSource/ci-github-actions/build-maven@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
        with:
          maven-args: -DskipIts
          sonar-platform: none
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          deploy-pull-request: true

  build_dotnet:
    needs: build_number
    runs-on: github-ubuntu-latest-m
    name: Build Dotnet
    permissions:
      id-token: write
      contents: write
    env:
      BUILD_NUMBER: ${{ needs.build_number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          install_args: --jobs 1

      - name: Install dependencies
        run: |
          bash .github/scripts/install_dependencies.sh
          dotnet tool install --global dotnet-sonarscanner

      - name: Get Repox Credentials from Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@c154b4a417b51cb98dd71137f49bf20e77c56820 # 3.4.0
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/kv/data/next url | NEXT_URL;
            development/kv/data/next token | NEXT_TOKEN;

      - name: Populate Maven settings
        run: |
          mkdir ~/.m2 && cp .github/workflows/resources/settings.xml ~/.m2/settings.xml

      - name: Build and analyze dotnet project
        env:
          SONAR_HOST_URL: ${{ fromJSON(steps.secrets.outputs.vault).NEXT_URL }}
          SONAR_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).NEXT_TOKEN }}
          # for nuget
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          # for Maven
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          bash .github/scripts/build_scan_dotnet.sh

      - name: Upload .NET DLL artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dotnet-dll
          path: omnisharp-dotnet/JarContentFiles/SonarLint.OmniSharp.DotNet.Services.dll

  qa_linux:
    needs:
      - build_number
      - build_maven_parent
    runs-on: github-ubuntu-latest-m
    name: QA Linux
    env:
      BUILD_NUMBER: ${{ needs.build_number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          install_args: --jobs 1

      - name: Get Vault secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@c154b4a417b51cb98dd71137f49bf20e77c56820 # 3.4.0
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - name: Install Mono tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg
          sudo gpg --homedir /tmp --no-default-keyring --keyring /usr/share/keyrings/mono-official-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          echo "deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt-get update
          sudo apt-get install -y mono-complete mono-roslyn msbuild
          sudo rm -rf /var/lib/apt/lists/*
          dotnet tool install --global dotnet-sonarscanner --version 8.0

      - uses: SonarSource/ci-github-actions/config-maven@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
        with:
          common-mvn-flags: -Dmaven.install.skip=true -Dsonar.skip=true -Dcyclonedx.skip=false
          artifactory-reader-role: private-reader

      - name: Run QA tests
        env:
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          mvn -B -e -V -f its/pom.xml verify -DskipTests=false -Dmaven.deploy.skip=true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-linux-test-results
          path: '**/surefire-reports/TEST-*.xml'

  qa_windows:
    needs:
      - build_number
      - build_maven_parent
    runs-on: warp-custom-sonarlint-visualstudio
    env:
      BUILD_NUMBER: ${{ needs.build_number.outputs.BUILD_NUMBER }}
    name: QA Windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          install_args: --jobs 1

      - name: Get Vault secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@c154b4a417b51cb98dd71137f49bf20e77c56820 # 3.4.0
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - uses: SonarSource/ci-github-actions/config-maven@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
        with:
          common-mvn-flags: -Dmaven.install.skip=true -Dsonar.skip=true -Dcyclonedx.skip=false -Dmaven.deploy.skip=true
          artifactory-reader-role: private-reader

      - name: Run QA tests
        shell: bash
        env:
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          mvn -B -e -V -f its/pom.xml verify -DskipTests=false

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-windows-test-results
          path: '**/surefire-reports/TEST-*.xml'

  validate_linux:
    needs:
      - build_number
      - build_dotnet
    runs-on: github-ubuntu-latest-m
    name: Validate Linux
    env:
      BUILD_NUMBER: ${{ needs.build_number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          install_args: --jobs 1

      - name: Download .NET DLL artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dotnet-dll
          path: omnisharp-dotnet/JarContentFiles/

      - name: Get Vault secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@c154b4a417b51cb98dd71137f49bf20e77c56820 # 3.4.0
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - name: Validate build
        env:
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}

        uses: SonarSource/ci-github-actions/build-maven@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
        with:
          maven-args: -DskipIts -Dmaven.deploy.skip=true -P-deploy-sonarsource,-release,-sign -Dsonar.analysisCache.enabled=true
          sonar-platform: next
          artifactory-deployer-role: qa-deployer
          artifactory-reader-role: private-reader

  validate_windows:
    needs:
      - build_number
      - build_dotnet
    runs-on: github-windows-latest-m
    name: Validate Windows
    env:
      BUILD_NUMBER: ${{ needs.build_number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          install_args: --jobs 1

      - name: Download .NET DLL artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dotnet-dll
          path: omnisharp-dotnet/JarContentFiles/

      - name: Get Vault secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@c154b4a417b51cb98dd71137f49bf20e77c56820 # 3.4.0
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - name: Validate build
        env:
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}

        uses: SonarSource/ci-github-actions/build-maven@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
        with:
          maven-args: -DskipIts -Dmaven.deploy.skip=true -P-deploy-sonarsource,-release,-sign -Dsonar.analysisCache.enabled=true
          sonar-platform: none
          artifactory-deployer-role: qa-deployer
          artifactory-reader-role: private-reader

  promote:
    needs:
      - build_number
      - build_maven_parent
      - validate_linux
      - validate_windows
      - qa_linux
      - qa_windows
    runs-on: github-ubuntu-latest-s
    name: Promote
    env:
      BUILD_NUMBER: ${{ needs.build_number.outputs.BUILD_NUMBER }}
    steps:
      - uses: SonarSource/ci-github-actions/promote@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
        with:
          promote-pull-request: true
