name: Experiment QA Windows VS18 diagnostics
# Throwaway diagnostics for the legacy (net472) OmniSharp flavor on the warp-custom-sonarlint-visualstudio image. Not for merging.

on:
  push:
    branches:
      - experiment/qa-windows-vs18-diagnostics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: warp-custom-sonarlint-visualstudio
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline
          - fork-build
    steps:
      - uses: actions/checkout@v5

      - name: Get OmniSharp net472 (official 1.39.15.1-sonar for baseline, fork branch build for fork-build)
        shell: powershell
        run: |
          if ('${{ matrix.variant }}' -eq 'fork-build') {
            Copy-Item experiment-assets\omnisharp-net472-fork-build.zip omnisharp-net472.zip
          } else {
            Invoke-WebRequest -UseBasicParsing -Uri 'https://binaries.sonarsource.com/OmniSharp-Roslyn/1.39.15.1-sonar/omnisharp-net472.zip' -OutFile omnisharp-net472.zip
          }
          Write-Host ("zip sha256: " + (Get-FileHash omnisharp-net472.zip -Algorithm SHA256).Hash)
          Expand-Archive -Path omnisharp-net472.zip -DestinationPath omnisharp-win -Force

      - name: Compare assembly versions (OmniSharp vs VS 18 MSBuild)
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products '*' -property installationPath
          $vsBin = Join-Path $installPath 'MSBuild\Current\Bin'
          $names = 'Microsoft.Bcl.AsyncInterfaces', 'System.Threading.Tasks.Extensions', 'System.Memory', 'System.Buffers', 'System.Runtime.CompilerServices.Unsafe', 'System.Numerics.Vectors', 'Microsoft.Build', 'Microsoft.Build.Framework'
          foreach ($n in $names) {
            foreach ($dir in @((Resolve-Path omnisharp-win).Path, $vsBin)) {
              $f = Join-Path $dir "$n.dll"
              if (Test-Path $f) {
                $an = [System.Reflection.AssemblyName]::GetAssemblyName($f)
                Write-Host ("{0,-45} asm={1,-12} file={2,-18} in {3}" -f $n, $an.Version, (Get-Item $f).VersionInfo.FileVersion, $dir)
              } else {
                Write-Host ("{0,-45} (absent) in {1}" -f $n, $dir)
              }
            }
          }
          Write-Host '=== MSBuild.exe.config redirects for the same assemblies'
          $cfg = Join-Path $vsBin 'MSBuild.exe.config'
          Select-String -Path $cfg -Pattern 'AsyncInterfaces|Tasks.Extensions|System.Memory|System.Buffers|CompilerServices.Unsafe|Numerics.Vectors' -Context 0,2 | ForEach-Object { $_.Line.Trim(); $_.Context.PostContext | ForEach-Object { $_.Trim() } }

      - name: Run legacy OmniSharp on the 4.8 solution
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = (Resolve-Path 'omnisharp-win\OmniSharp.exe').Path
          $sln = (Resolve-Path 'its/src/test/projects/DotNetFramework4_8/DotNetFramework4_8.sln').Path
          dotnet restore $sln | Out-Null
          $omniArgs = @('-v', 'MsBuild:loadProjectsOnDemand=false', 'DotNet:enablePackageRestore=false', '--encoding', 'utf-8', '-s', $sln)
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.Arguments = ($omniArgs | ForEach-Object { if ($_ -match '\s') { '"' + $_ + '"' } else { $_ } }) -join ' '
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          $outTask = $p.StandardOutput.ReadToEndAsync()
          $errTask = $p.StandardError.ReadToEndAsync()
          Start-Sleep -Seconds 40
          Write-Host "OmniSharp still running after 40s: $(-not $p.HasExited)"
          if (-not $p.HasExited) {
            Write-Host '=== modules loaded by the OmniSharp process (async/MSBuild related)'
            $p.Refresh()
            $p.Modules | Where-Object { $_.ModuleName -match 'AsyncInterfaces|Tasks.Extensions|System.Memory|System.Buffers|Unsafe|Microsoft.Build' } | ForEach-Object { Write-Host ("{0,-45} {1,-16} {2}" -f $_.ModuleName, $_.FileVersionInfo.FileVersion, $_.FileName) }
            $p.Kill()
          }
          [void]$outTask.Wait(15000)
          [void]$errTask.Wait(15000)
          $outTask.Result | Out-File -Encoding utf8 out\omnisharp-stdout.txt
          $errTask.Result | Out-File -Encoding utf8 out\omnisharp-stderr.txt
          $o = $outTask.Result
          Write-Host ("=== RESULT variant=${{ matrix.variant }}: TypeLoadException(DisposeAsync)={0}; 'Failed to load project file'={1}; MsBuildProjectDiagnostics events={2}; 'Adding project'={3}" -f ([regex]::Matches($o, 'DisposeAsync')).Count, ([regex]::Matches($o, 'Failed to load project file')).Count, ([regex]::Matches($o, 'MsBuildProjectDiagnostics')).Count, ([regex]::Matches($o, 'Adding project')).Count)
          Select-String -Path out\omnisharp-stdout.txt -Pattern '"LogLevel":"ERROR"|"Event":"Error"|MsBuildProjectDiagnostics|Adding project' | ForEach-Object { $_.Line.Substring(0, [Math]::Min(500, $_.Line.Length)) } | Select-Object -First 25

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: confirm-${{ matrix.variant }}
          path: out/
